# creep configuration v0.3.0

server:
  name: "creep.local"
  motd: |
    Welcome to creep IRC.
    This server supports Markdown formatting in messages.
    Type /help in your client for a list of commands.
  max_nick_length: 30
  max_channel_length: 50
  max_message_length: 512
  history_lines: 50
  ping_interval: 60
  log_file: null
  opers:
    - name: "admin"
      password: "changeme"
  listeners:
    - host: "0.0.0.0"
      port: 6677
      tls: false
    - host: "0.0.0.0"
      port: 6697
      tls: true
      cert: "config/server.crt"
      key:  "config/server.key"
    - host: "127.0.0.1"
      port: 6678
      tls: false
    - host: "127.0.0.1"
      port: 6679
      tls: false

client:
  # Use port 6667 (plain TCP) for local testing.
  # Change to 6697 + tls: true for encrypted.
  server: "127.0.0.1"
  port: 6677
  tls: false
  tls_verify: false
  proxy: null
  nick: "user"
  user: "user"
  realname: "creep user"
  autojoin:
    - "#general"
  kitty_graphics: true
  scrollback: 500
  timestamp_format: "%H:%M"
  theme: "default"
  # Local chat log database path (SQLite)
  log_db: "data/logs.db"
  # Sync chat logs with server on connect
  sync_logs: true

bot:
  nick: "creepbot"
  user: "creepbot"
  realname: "creep bot"
  autojoin:
    - "#general"
  webhook_url: null
  prefix: "!"