# creep configuration
# ---------------------------------------------------------------
# server.listeners: each entry spawns its own TCP or TLS socket.
#   transport: "tcp" | "tls"
#   tls: true requires cert + key paths.
#   proxy: optional SOCKS5 URL for outbound connections made by
#          the server (e.g. linking to another server over Tor).
#          For Tor use "socks5://127.0.0.1:9050"
#          For I2P use "socks5://127.0.0.1:4447"
#
# client section drives the CLI client binary.
#   proxy: SOCKS5 URL used for the client's outbound connection.
#
# bot section configures the built-in bot dispatcher.
# ---------------------------------------------------------------

server:
  name: "creep.local"
  motd: |
    Welcome to creep IRC.
    This server supports Markdown formatting in messages.
  listeners:
    # Plain TCP (ClearWeb or behind a reverse proxy)
    - host: "0.0.0.0"
      port: 6667
      transport: "tcp"
      tls: false

    # TLS (ClearWeb, direct SSL)
    - host: "0.0.0.0"
      port: 6697
      transport: "tcp"
      tls: true
      cert: "config/server.crt"
      key:  "config/server.key"

    # Tor hidden service: bind only to loopback; Tor maps the
    # .onion address to 127.0.0.1:6668 via HiddenServicePort.
    # Clients connect via the SOCKS5 proxy in their client config.
    - host: "127.0.0.1"
      port: 6678
      transport: "tcp"
      tls: false

    # I2P: bind to loopback; configure an I2P server tunnel
    # pointing at 127.0.0.1:6669 in your I2P router console.
    - host: "127.0.0.1"
      port: 6679
      transport: "tcp"
      tls: false

client:
  # Remote server to connect to
  server: "creep.local"
  port: 6697
  tls: true
  # For Tor: "socks5://127.0.0.1:9050"
  # For I2P: "socks5://127.0.0.1:4447"
  proxy: null
  nick: "user"
  user: "user"
  realname: "creep user"
  # Initial channels to auto-join on connect
  autojoin:
    - "#general"

bot:
  # nick the bot will register with
  nick: "creepbot"
  user: "creepbot"
  realname: "creep bot"
  # channels the bot joins automatically
  autojoin:
    - "#general"
  # Optional HTTP endpoint: POST events as JSON
  webhook_url: null
  # Command prefix (e.g. "!" means "!help" triggers help handler)
  prefix: "!"